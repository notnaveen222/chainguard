[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chainguard"
version = "0.1.0"
description = "AI-powered software supply chain security: malicious package detection and vulnerability reachability analysis"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["chainguard*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
# 100 is the target the code is written to; 110 is the enforced ceiling, so a
# descriptive identifier or a long URL in a comment does not force an awkward
# wrap that hurts readability more than the length does.
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
    # ChainGuard never spawns analysed code; nothing here shells out to a
    # package under inspection.
    "S603", "S607",
    # `Optional[X]` is kept over `X | None`. Both are valid under
    # `from __future__ import annotations`, and the explicit form reads more
    # clearly in a codebase where a great many values are genuinely optional
    # (registry metadata is inconsistent by nature). Changing 150 signatures
    # would be churn with no behavioural benefit.
    "UP045", "UP007",
    # typer's API requires calls in argument defaults; that is how it declares
    # CLI options.
    "B008",
    # Every remaining `zip()` was reviewed individually. All pair sequences whose
    # lengths are equal by construction (a feature vector against its own name
    # list, a gather result against the list it was built from). The one case
    # where a mismatch was actually possible — OSV's batch endpoint returning
    # fewer results than queries — is checked and logged explicitly in
    # vulns/osv.py rather than left to `strict=True` to crash a scan.
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and use short throwaway values.
"backend/tests/*" = ["S101", "S105", "S106", "E501"]
# Scripts adjust sys.path before importing the package, which requires imports
# after statements.
"scripts/*" = ["E402"]
